[package]
name = "cuw-capture"
description = "Statusline tee shim: forwards Claude Code statusline JSON unchanged and saves whitelisted usage fields"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[[bin]]
name = "cuw-capture"
path = "src/main.rs"

# The integration tests' helper process is examples/cuw-test-child.rs: an example, not a [[bin]],
# so `cargo build`/`cargo install` of this package never produce it. `cargo test` builds examples
# before running the tests, and tests/shim.rs finds it next to the shim in `<profile>/examples/`.

[dependencies]
cuw-core.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
