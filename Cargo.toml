[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cuw-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
dirs = "6"
notify = "8"
tempfile = "3"
proptest = "1"
pretty_assertions = "1"

# codegen-units = 1 made rustc run out of memory on the 14 GB dev laptop; thin LTO with the
# default unit count keeps binaries small without the memory spike.
[profile.release]
lto = "thin"
strip = true

[profile.release.package.cuw-capture]
opt-level = "z"
