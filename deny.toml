# cargo-deny: advisories, licenses, banned crates and allowed sources for the whole workspace.
# Run locally with `cargo deny check` (CI runs the same thing in the security job).

[graph]
# The app ships for Windows only; checking every target would pull in unrelated platform crates.
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# RustSec advisories: every vulnerability, unmaintained and unsound notice fails the check unless
# it is listed in `ignore` with a reason.
yanked = "deny"
ignore = [
    # Fixed in time 0.3.47 / plist 1.10 (quick-xml 0.41+), which need Rust 1.88: the workspace's
    # rust-version = "1.85" keeps the MSRV-aware resolver on the old versions. Remove these three
    # once rust-version is raised to 1.88 and `cargo update -p time -p plist` is run. Both crates
    # only parse Tauri's own build-time plist/config and cookie dates, never data from outside.
    { id = "RUSTSEC-2026-0009", reason = "time DoS; fix needs rust-version 1.88 (see above)" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist; fix needs rust-version 1.88 (see above)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist; fix needs rust-version 1.88 (see above)" },
    # unic-* are unmaintained (no vulnerability); pulled in by tauri-utils -> urlpattern 0.3.
    # Nothing to upgrade to until Tauri drops them.
    { id = "RUSTSEC-2025-0075", reason = "unic-* unmaintained, via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained, via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* unmaintained, via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained, via tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained, via tauri-utils/urlpattern" },
]

[licenses]
confidence-threshold = 0.93
# Permissive licenses used by the dependency tree (Tauri, windows-rs, serde, ...). MPL-2.0 is
# file-level copyleft and fine for an unmodified dependency.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LicenseRef-AllRightsReserved",
]

# Our own crates are proprietary (LICENSE: all rights reserved) and never published. They have no
# SPDX id, so each is clarified to a LicenseRef that only they use.
[[licenses.clarify]]
crate = "sovawatch-core"
expression = "LicenseRef-AllRightsReserved"
license-files = []

[[licenses.clarify]]
crate = "sovawatch-capture"
expression = "LicenseRef-AllRightsReserved"
license-files = []

[[licenses.clarify]]
crate = "sovawatch"
expression = "LicenseRef-AllRightsReserved"
license-files = []

[bans]
multiple-versions = "warn"
# Path dependencies are allowed because every workspace crate is `publish = false`.
wildcards = "deny"
allow-wildcard-paths = true
# No network client crates: the only network use is the opt-in update check via System32 curl.exe.
deny = [
    { crate = "reqwest", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "hyper", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "ureq", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "isahc", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "surf", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "attohttpc", reason = "no HTTP client crates (token-free, no network)" },
    { crate = "opentelemetry", reason = "no telemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
