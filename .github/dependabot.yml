# Weekly dependency updates. Minor and patch bumps come as one grouped PR per ecosystem; major
# bumps stay separate so each can be reviewed on its own. Actions are pinned to commit SHAs and
# Dependabot updates the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # These must stay on the versions Tauri/wry use (their COM types must be the same crate
    # version), so they move only together with a Tauri update.
    ignore:
      - dependency-name: webview2-com
      - dependency-name: windows-core
      # Tauri uses dirs 6; a newer major would ship a second copy for no gain.
      - dependency-name: dirs
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # TypeScript majors wait until svelte-check and the Svelte tooling support them.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
