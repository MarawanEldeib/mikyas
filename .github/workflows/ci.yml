name: CI

# Fork pull requests run here with a read-only token and no secrets (pull_request, never
# pull_request_target). Keep "Require approval for all outside collaborators" on in the repo's
# Actions settings so a fork cannot run code or write the caches before a review.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow as its quality and privacy gate, with no_cache: true so a
  # release never restores (or saves) a cache that another ref could have written.
  workflow_call:
    inputs:
      no_cache:
        description: Run without restoring or saving any Rust or npm cache.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_windows_x64.zip, from the release's gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e

# Every action is pinned to a full commit SHA (the tag is in the comment): a moved tag cannot
# change what runs here.
jobs:
  check:
    name: Lint, test, build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Secret scan (gitleaks)
        run: |
          $zip = "$env:RUNNER_TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:GITLEAKS_SHA256) { throw "gitleaks download checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\gitleaks"
          & "$env:RUNNER_TEMP\gitleaks\gitleaks.exe" git --redact --no-banner --config .gitleaks.toml
          if ($LASTEXITCODE -ne 0) { throw "gitleaks found a secret" }

      # The fixture check the pre-commit hook runs (added after a real token leak): enforced here
      # too, because a local hook can be missing or skipped.
      - name: Fixtures are synthetic
        run: |
          $files = @(git ls-files 'crates/**/fixtures/**')
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed" }
          if (-not $files) { throw "no fixture files found" }
          node scripts/check-fixtures.mjs @files
          if ($LASTEXITCODE -ne 0) { throw "fixture check failed" }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.no_cache }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ !inputs.no_cache && 'npm' || '' }}
      # No install scripts: the only ones are lefthook's git-hook installer (not needed on a
      # runner) and fsevents (macOS only).
      - run: npm ci --ignore-scripts

      - name: Privacy grep (no credentials, cookies, Anthropic hosts or claude.ai in code)
        run: node scripts/privacy-grep.mjs

      - name: Versions agree (package.json, Cargo.toml, tauri.conf.json)
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "package.json $npm · tauri.conf.json $tauri · Cargo.toml $cargo"
          if ($npm -ne $tauri -or $npm -ne $cargo) { throw "version mismatch" }

      - name: No network client crates (the only network use is the opt-in update check via curl.exe)
        run: |
          $tree = cargo tree --workspace --target x86_64-pc-windows-msvc -e normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw "cargo tree failed" }
          $hits = $tree | Select-String -Pattern '^(reqwest|hyper|ureq|isahc|surf|attohttpc|opentelemetry)[ -]'
          if ($hits) { $hits; throw "network client crates in the dependency tree" }

      # Tauri's build script needs the sidecar binary to exist.
      - name: Build the capture shim
        run: ./scripts/build-sidecar.ps1

      # crates/capture is formatted: keep it that way.
      - name: rustfmt (capture shim)
        run: cargo fmt -p cuw-capture -- --check
      # Advisory for the rest until it is formatted in one sweep (it predates rustfmt in CI).
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: UI tests (vitest)
        run: npm test
      - name: svelte-check
        run: npm run check
      - name: UI build
        run: npm run build
