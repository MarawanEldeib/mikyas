name: Release

# The only way official releases are built (mikyas-release skill; docs/verify-release.md).
#
# Manual only (workflow_dispatch): `gh workflow run release.yml --ref vX.Y.Z` after pushing the
# tag (it refuses to run on a branch). It runs the whole CI workflow as the test gate (lint,
# Rust/UI/browser/app tests, security), then builds the per-user NSIS installer with locked
# dependencies in a job that holds only a read-only token, then a separate publish job (gated by
# the `release` environment) attests the build provenance and creates a DRAFT GitHub release with
# the installer and SHA256SUMS. The release skill then writes the bullet notes and publishes the
# draft. The version in package.json, Cargo.toml and src-tauri/tauri.conf.json must equal the tag
# (without "v"), and the tagged commit must be on main.
#
# Repo settings this relies on (not expressible here): the `release` environment (owner as
# required reviewer, deployments only from `v*` tags), the `v* tags` ruleset (only admins
# create, move or delete release tags), and immutable releases (a published release's assets and
# tag can never be changed).
#
# Verify a downloaded installer:
#   gh attestation verify <installer.exe> --repo MarawanEldeib/mikyas

on:
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA (the tag is in the comment). No caches are restored
# or saved here: a release always builds from a clean state.
jobs:
  guard:
    name: Dispatched from a tag
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse branch runs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a release tag (v*), not the branch $REF_NAME"
            exit 1
          fi
          case "$REF_NAME" in v*) ;; *) echo "::error::tag $REF_NAME is not a v* tag"; exit 1 ;; esac

  # Every test (unit, property, integration, browser and app end-to-end, visual) and every
  # security check, from a clean state. The CI installer job is skipped: `build` makes the real one.
  check:
    name: CI gate
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      no_cache: true
      skip_installer: true
    permissions:
      contents: read

  build:
    name: Build installer (read-only token)
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the "tag is on main" check needs history
          persist-credentials: false

      - name: Tag matches the app version
        run: ./scripts/ci/check-versions.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "fetching main failed" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:GITHUB_SHA is not on main" }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # never a cache in a release build
      # No install scripts (lefthook's hook installer is not needed here), and no token to steal:
      # this job's GITHUB_TOKEN is read-only and checkout did not persist it.
      - run: npm ci --ignore-scripts

      # Only the mikyas-capture shim, copied to src-tauri/binaries/ for bundle.externalBin.
      - name: Build the capture shim
        run: ./scripts/build-sidecar.ps1

      # The Tauri CLI directly (no tauri-action): nothing in this job can publish.
      - name: Build the installer
        run: |
          $env:CARGO_ENCODED_RUSTFLAGS = & ./scripts/release-rustflags.ps1
          npx --no-install tauri build --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      - name: Collect the installer and SHA256SUMS
        run: |
          $targetDir = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          $files = @(Get-ChildItem (Join-Path $targetDir 'release\bundle\nsis') -Filter '*.exe')
          if ($files.Count -ne 1) { throw "expected one installer, found $($files.Count)" }
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dist"
          # The name GitHub would give the uploaded asset: spaces and other special characters
          # become dots (e.g. "My App_1.0.0_x64-setup.exe" -> My.App_1.0.0_x64-setup.exe). Renamed here, so
          # SHA256SUMS, the attestation and the asset all use the same name.
          $name = ($files[0].Name.Trim() -replace '[^a-zA-Z0-9_.-]', '.') -replace '\.\.+', '.'
          Copy-Item -LiteralPath $files[0].FullName -Destination (Join-Path $out $name)
          $line = "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 (Join-Path $out $name)).Hash.ToLower(), $name
          $line
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS'), "$line`n")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and create the draft release
    needs: build
    runs-on: ubuntu-latest
    # Required reviewer gate (configure the `release` environment in the repo settings).
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write
    steps:
      # No checkout and no build here: this job only handles the finished files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: dist

      - name: Check SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/SHA256SUMS
          create-storage-record: false # no registry push; needs no artifact-metadata permission

      # Title and body follow the hand-made releases: the tag as title and, once the release
      # skill has written them, only short bullet notes (the in-app updater shows those).
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" dist/*.exe dist/SHA256SUMS
