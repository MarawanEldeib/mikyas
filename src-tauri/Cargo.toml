[package]
name = "claude-usage-widget"
description = "Floating, token-free Claude usage widget"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[lib]
name = "cuw_widget_lib"
# Desktop only: staticlib/cdylib are for mobile targets and triple LLVM memory use.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cuw-core.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's wry uses (for the WebView2 memory-target call).
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Fullscreen auto-hide: window queries only (see src/fullscreen.rs).
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
