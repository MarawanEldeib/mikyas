[package]
name = "sovawatch"
description = "SovaWatch — usage widget for Claude Code & Claude Desktop"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sovawatch_lib"
# Desktop only: staticlib/cdylib are for mobile targets and triple LLVM memory use.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sovawatch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's wry uses (for the WebView2 memory-target call).
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Fullscreen auto-hide: window queries only (see src/fullscreen.rs).
    "Win32_Graphics_Gdi",
    # DLL search restricted to the app folder and System32 at startup.
    "Win32_System_LibraryLoader",
    # The taskbar theme (SystemUsesLightTheme) for the tray number.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
# Only for the released v0 statusline code the migration tests run (src/migrate/legacy_v0_*.rs).
thiserror.workspace = true
